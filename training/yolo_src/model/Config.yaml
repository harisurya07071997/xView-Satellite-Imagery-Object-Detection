
dataset:
    yaml_file: "../dataset/data.yaml"

model:

    name: "yolov9c.pt"
    tuning_epochs: 50
    checkpoint: ""

    wandb:
        sweep_config:
            method: random

            metric:
                name: val/f1_score
                goal: maximize
         
            parameters:
                hsv_h:
                    min: 0.005
                    max: 0.015
                    distribution: uniform

                hsv_s:
                    min: 0.5
                    max: 0.7
                    distribution: uniform

                hsv_v:
                    min: 0.2
                    max: 0.4
                    distribution: uniform

                scale:
                    min: 0.2
                    max: 0.6
                    distribution: uniform

                translate:
                    min: 0.02
                    max: 0.08
                    distribution: uniform

                lr0:
                    min: 0.0002
                    max: 0.01
                    distribution: log_uniform_values

                cls_pw:
                    min: 0.0
                    max: 1.0
                    distribution: uniform

                degrees:
                    values: [0, 2, 3, 5, 8]

                flipud:
                    values: [0.0, 0.25, 0.5]

                fliplr:
                    values: [0.0, 0.25, 0.5]

                cutmix:
                    min: 0.0
                    max: 0.3
                    distribution: uniform

                copy_paste:
                    min: 0.0
                    max: 0.3
                    distribution: uniform

                mosaic:
                    min: 0.0
                    max: 0.4

                cos_lr:
                    values: [True, False] 



    yolo:
        project: "xView-Satellite-Imagery:v2"
        
        epochs: 500
        warmup_epochs: 25
        patience: 150
        
        batch: 32
        imgsz: 256
        workers: 8
        device: 0
        cache: False
        fraction: 1.0
        
        single_cls: False
        rect: False
        multi_scale: False

        val: True
        save: True
        plots: True
        save_period: 5
        resume: False
        
        seed: 0
        deterministic: True
        amp: True
        compile: True
        profile: False

        optimizer: "AdamW"
        lr0: 0.0013875
        lrf: 0.01
        weight_decay: 0.0005
        momentum: 0.937
        cos_lr: True
        warmup_momentum: 0.8
        warmup_bias_lr: 0.1

        dropout: 0.1
        freeze: None

        hsv_h: 0.010742
        hsv_s: 0.61436
        hsv_v: 0.25144
        
        degrees: 0.0
        translate: 0.069993
        scale : 0.20706
        shear : 0.0
        perspective: 0.0
        flipud: 0.0
        fliplr: 0.5

        degrees: 3.0

        cls_pw: 0.3
        
        bgr: 0.0
        cutmix: 0.19692
        mosaic: 0.5
        copy_paste: 0.15
        close_mosaic: 0.05
        